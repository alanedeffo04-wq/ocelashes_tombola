<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocelashes · Tombola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="demo" id="demo">MODE DÉMO — numéros stockés localement / demo mode: numbers stored locally</div>

<header class="top">
  <div class="logo"><img src="logo.png" alt="Ocelashes" onerror="this.replaceWith(document.createTextNode('OCELASHES'))"></div>
  <div class="lang" role="group" aria-label="Langue / Language">
    <button type="button" data-l="fr">FR</button><button type="button" data-l="en">EN</button>
  </div>
</header>

<main>

  <!-- 1. Accueil -->
  <section class="screen on" id="s-home">
    <div class="home">
      <div class="home-text">
        <p class="kicker" data-i18n="launch"></p>
        <h1 data-i18n-html="h1"></h1>
        <p data-i18n="intro"></p>
        <div class="card"><b data-i18n="datesT"></b><br><span id="dates"></span></div>
        <button type="button" class="btn" id="go" data-i18n="enter"></button>
        <p class="small center" data-i18n="free"></p>
      </div>
      <div class="home-img">
        <img class="hero" src="acceuil.png" alt="Ocelashes" onerror="this.classList.add('missing')">
      </div>
    </div>
  </section>

  <!-- 2. Étape TikTok -->
  <section class="screen narrow" id="s-tiktok">
    <div class="steps"><i class="on"></i><i></i></div>
    <h1 data-i18n="tkT"></h1>
    <p data-i18n="tkP"></p>
    <a class="btn alt" id="tk" target="_blank" rel="noopener"><span data-i18n="follow"></span></a>
    <div class="card" id="back" hidden data-i18n="back"></div>
    <label class="chk"><input type="checkbox" id="c-tk"><span data-i18n="confirmTk"></span></label>
    <button type="button" class="btn" id="to-form" disabled data-i18n="continue"></button>
  </section>

  <!-- 3. Formulaire -->
  <section class="screen narrow" id="s-form">
    <div class="steps"><i class="on"></i><i class="on"></i></div>
    <h1 data-i18n="fT"></h1>
    <label for="fn" data-i18n="first"></label>
    <input type="text" id="fn" autocomplete="given-name">
    <div class="err" id="e-fn"></div>
    <label for="ln" data-i18n="last"></label>
    <input type="text" id="ln" autocomplete="family-name">
    <div class="err" id="e-ln"></div>
    <label for="ph" data-i18n="phone"></label>
    <input type="tel" id="ph" autocomplete="tel" inputmode="tel" placeholder="+1 514 000 0000">
    <div class="err" id="e-ph"></div>
    <label class="chk">
      <input type="checkbox" id="c-rules">
      <span><span data-i18n="acceptA"></span> <a href="#" data-open="rules" data-i18n="rulesL"></a> <span data-i18n="and"></span> <a href="#" data-open="priv" data-i18n="privL"></a>.</span>
    </label>
    <div class="err" id="e-gen"></div>
    <button type="button" class="btn" id="submit" data-i18n="submit"></button>
  </section>

  <!-- 4. Chargement -->
  <section class="screen narrow center" id="s-load">
    <div class="spin"></div>
    <p data-i18n="loading"></p>
  </section>

  <!-- 5. Félicitations -->
  <section class="screen narrow center" id="s-done">
    <h1 class="pink" data-i18n="congrats"></h1>
    <p data-i18n="saved"></p>
    <p class="numlabel" data-i18n="yourNum"></p>
    <div class="num" id="num">OC-0000</div>
    <div class="card left" data-i18n="shot"></div>
    <button type="button" class="btn" id="copy" data-i18n="copy"></button>
    <button type="button" class="btn alt" id="wa" data-i18n="share"></button>
    <p data-i18n="luck"></p>
  </section>

  <!-- 6. Inscriptions closes -->
  <section class="screen narrow center" id="s-closed">
    <h1 data-i18n="closed"></h1>
  </section>

</main>

<footer>
  <button type="button" data-open="rules" data-i18n="rulesL"></button> ·
  <button type="button" data-open="priv" data-i18n="privL"></button>
</footer>

<dialog id="dlg">
  <div id="dlg-body"></div>
  <button type="button" class="btn" id="dlg-close" data-i18n="close"></button>
</dialog>

<canvas id="cf" aria-hidden="true"></canvas>
<script src="script.js"></script>
</body>
</html>
